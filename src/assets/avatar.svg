<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="个人头像占位图">
  <defs>
    <linearGradient id="avatar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- 渐变背景（青 → 紫，与主题强调色一致） -->
  <rect width="512" height="512" rx="256" fill="url(#avatar-bg)"/>
  <!-- 深色人物剪影：头部 + 肩部 -->
  <circle cx="256" cy="196" r="88" fill="#0a0a0a" fill-opacity="0.88"/>
  <path d="M256 320c-98 0-164 58-176 138h352c-12-80-78-138-176-138z" fill="#0a0a0a" fill-opacity="0.88"/>
</svg>
