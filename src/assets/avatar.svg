<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="杨阳的动漫风格头像">
  <defs>
    <linearGradient id="avatar-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <radialGradient id="iris" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </radialGradient>
  </defs>

  <!-- 圆形背景（浅蓝渐变） -->
  <rect width="512" height="512" rx="256" fill="url(#avatar-bg)"/>

  <!-- 后层头发 -->
  <circle cx="256" cy="240" r="185" fill="#1e293b"/>

  <!-- 头发高光 -->
  <path d="M 170 150 Q 230 108 300 140" stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.3"/>

  <!-- 脸 -->
  <ellipse cx="256" cy="315" rx="106" ry="114" fill="#ffe6c9"/>

  <!-- 耳朵 -->
  <circle cx="146" cy="322" r="20" fill="#ffe6c9"/>
  <circle cx="366" cy="322" r="20" fill="#ffe6c9"/>

  <!-- 刘海（三片圆弧） -->
  <ellipse cx="212" cy="205" rx="76" ry="90" fill="#1e293b"/>
  <ellipse cx="300" cy="203" rx="78" ry="92" fill="#1e293b"/>
  <ellipse cx="256" cy="185" rx="58" ry="76" fill="#1e293b"/>

  <!-- 眉毛 -->
  <path d="M 176 286 Q 204 268 236 282" stroke="#1e293b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M 276 282 Q 308 268 336 286" stroke="#1e293b" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- 左眼：眼白 + 虹膜 + 瞳孔 + 高光 + 上睫毛 -->
  <ellipse cx="204" cy="338" rx="34" ry="38" fill="#ffffff"/>
  <circle cx="204" cy="341" r="24" fill="url(#iris)"/>
  <circle cx="204" cy="343" r="11" fill="#0f172a"/>
  <circle cx="192" cy="328" r="7" fill="#ffffff"/>
  <circle cx="215" cy="351" r="4" fill="#ffffff"/>
  <path d="M 170 324 Q 204 296 238 324" stroke="#1e293b" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- 右眼 -->
  <ellipse cx="308" cy="338" rx="34" ry="38" fill="#ffffff"/>
  <circle cx="308" cy="341" r="24" fill="url(#iris)"/>
  <circle cx="308" cy="343" r="11" fill="#0f172a"/>
  <circle cx="296" cy="328" r="7" fill="#ffffff"/>
  <circle cx="319" cy="351" r="4" fill="#ffffff"/>
  <path d="M 274 324 Q 308 296 342 324" stroke="#1e293b" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- 腮红 -->
  <circle cx="172" cy="378" r="15" fill="#fda4af" opacity="0.55"/>
  <circle cx="340" cy="378" r="15" fill="#fda4af" opacity="0.55"/>

  <!-- 嘴 -->
  <path d="M 236 396 Q 256 412 276 396" stroke="#b45309" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 脖子 -->
  <rect x="234" y="404" width="44" height="58" fill="#ffe6c9"/>

  <!-- 肩部（深色上衣） -->
  <path d="M 148 452 Q 256 500 364 452 L 364 512 L 148 512 Z" fill="#1e293b"/>
</svg>
